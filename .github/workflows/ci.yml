# Niu-MissionControl CI
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Lint (syntax check)
        run: |
          python -m py_compile server.py
          python -m py_compile modules/hermes_bridge.py
          python -m py_compile modules/hermes_status.py
          python -m py_compile swarm/agents.py
          python -m py_compile swarm/bus.py
          python -m py_compile swarm/worker.py

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short
        env:
          MC_API_KEY: ""
          PYTHONPATH: .
