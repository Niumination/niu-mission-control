name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd apex-ui
          npm ci

      - name: Build
        run: |
          cd apex-ui
          npm run build

      - name: Lint
        run: |
          cd apex-ui
          npm run lint

      - name: Type check
        run: |
          cd apex-ui
          npx tsc --noEmit
