name: CI — v4.1 Aether Sync

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22 (gold standard)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apex-ui/package-lock.json

      - name: Install dependencies
        run: cd apex-ui && npm ci

      - name: Lint
        run: cd apex-ui && npm run lint

      - name: Type check (tsc 0)
        run: cd apex-ui && npx tsc --noEmit

      - name: Unit tests (vitest 12/12)
        run: cd apex-ui && npm run test

      - name: Build (Next 16.3.5 webpack, 11 pages)
        run: cd apex-ui && npm run build

      - name: Install Playwright
        run: cd apex-ui && npx playwright install --with-deps

      - name: Start dev server for E2E
        run: |
          cd apex-ui
          npm run dev &
          echo $! > /tmp/dev.pid
          npx wait-on http://localhost:3000/api/mc/health --timeout 60000

      - name: SSE integration test (10 cases)
        run: cd apex-ui && MC_PASSWORD=apex node scripts/test-sse.mjs
        env:
          MC_PASSWORD: apex

      - name: A11y audit (axe-core, 7 routes, WCAG 2.2 AA)
        run: cd apex-ui && node tests/e2e/a11y.mjs
        env:
          BASE_URL: http://localhost:3000
          MC_PASSWORD: apex

      - name: Stop dev server
        if: always()
        run: kill $(cat /tmp/dev.pid) || true

