name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio pydantic-settings aiosqlite

      - name: Lint
        run: |
          pip install ruff
          ruff check backend/app/ --select E,F,W

      - name: Type check
        run: |
          pip install pyright
          pyright backend/app/ --outputjson 2>/dev/null || true

      - name: Test (backend)
        run: |
          cd backend
          python -m pytest tests/ -v

      - name: Test (legacy)
        run: |
          python -m pytest tests/ -v

      - name: Frontend asset check
        run: |
          test -f dashboard/index.html
          test -f dashboard/orb.css
          test -f dashboard/orb.js

      - name: Docker build
        run: docker build -t mc-test . || echo "docker unavailable, skipping"
