services:
  mission-control:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: niu-mission-control:4.1
    container_name: niu-mission-control
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ../data:/app/data
    env_file:
      - ../.env.local
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MC_DB_PATH=/app/data/swarm_state.db
      - LOG_LEVEL=info
      - BUDGET_ENFORCEMENT=soft
      - HOSTNAME=0.0.0.0
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/mc/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
