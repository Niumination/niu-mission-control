<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HERMES // FUSION — Unified Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
/*═══════════════════════════════════════════════════
  FUSION v2 — DESIGN TOKENS (unified: dark + cyan/glass)
═══════════════════════════════════════════════════*/
:root{
  --glass:rgba(10,15,28,.82);--glass-b:rgba(111,216,255,.14);
  --cy400:#22d3ee;--cy500:#06b6d4;--cy600:#0891b2;
  --or400:#fb923c;--or500:#f97316;
  --green:#22c55e;--red:#ef4444;--am400:#fbbf24;--violet:#8b5cf6;
  --t1:#f1f5f9;--t2:#94a3b8;--t3:#64748b;--t4:#334155;
  --r:14px;--rs:10px;
  --font-head:'Space Grotesk',sans-serif;--font-body:'Inter',sans-serif;--font-mono:'JetBrains Mono',monospace;
  --ease:cubic-bezier(.34,1.3,.4,1);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font-body);background:#05070d;color:var(--t1);font-size:13px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--t4);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--t3)}

/*══════ ORB CANVAS — fullscreen background ══════*/
#orb-canvas{position:fixed;inset:0;z-index:0;display:block;width:100%;height:100%;pointer-events:auto}
.orb-dim{position:fixed;inset:0;background:rgba(3,5,10,.45);opacity:0;pointer-events:none;transition:opacity .3s;z-index:2}
.orb-dim.show{opacity:1;pointer-events:auto}

/*══════ LAUNCHER — pojok kanan atas ══════*/
.launcher{position:fixed;top:14px;right:14px;display:flex;gap:8px;z-index:50}
.launch-btn{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:12px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--glass-b);font-family:var(--font-head);font-size:.68rem;font-weight:600;letter-spacing:.5px;color:var(--t2);transition:all .2s;box-shadow:0 6px 24px -8px rgba(0,0,0,.6)}
.launch-btn:hover{transform:translateY(-2px);color:var(--t1);border-color:rgba(111,216,255,.35)}
.launch-btn i{font-size:.75rem}
.launch-btn .lb-ico{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:.68rem;color:#fff}
.lb-dash{background:linear-gradient(135deg,#7c3aed,#4f46e5)}
.lb-aios{background:linear-gradient(135deg,#ea580c,#f59e0b)}
.launch-btn .lb-txt{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15}
.launch-btn .lb-txt small{font-size:.5rem;color:var(--t3);letter-spacing:1px;font-family:var(--font-mono)}
.launch-btn.on{background:rgba(111,216,255,.12);border-color:rgba(111,216,255,.4);color:var(--t1)}

/*══════ FLOATING WINDOWS ══════*/
.fwin{position:fixed;background:var(--glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--glass-b);border-radius:var(--r);box-shadow:0 24px 80px -16px rgba(0,0,0,.75),0 0 0 1px rgba(111,216,255,.05);display:flex;flex-direction:column;min-width:340px;min-height:240px;z-index:100;opacity:0;transform:scale(.88) translateY(14px);pointer-events:none;transition:opacity .28s var(--ease),transform .28s var(--ease)}
.fwin.open{opacity:1;transform:scale(1) translateY(0);pointer-events:auto}
.fwin.closing{opacity:0;transform:scale(.9) translateY(10px);pointer-events:none}
.fwin.focused{z-index:200;box-shadow:0 28px 100px -16px rgba(0,0,0,.85),0 0 0 1px rgba(111,216,255,.22),0 0 44px -10px rgba(111,216,255,.22)}
.fwin.minimized{opacity:0;transform:scale(.92) translateY(24px);pointer-events:none}

.fwin-bar{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:grab;user-select:none;flex-shrink:0;border-bottom:1px solid rgba(111,216,255,.08);border-radius:var(--r) var(--r) 0 0;background:rgba(13,20,38,.6)}
.fwin-bar:active{cursor:grabbing}
.fwin-dots{display:flex;gap:6px;flex-shrink:0}
.fdot{width:11px;height:11px;border-radius:50%;transition:filter .15s}
.fdot:hover{filter:brightness(1.35)}
.fdot-close{background:#ef4444}
.fdot-min{background:#fbbf24}
.fdot-max{background:#22c55e}
.fwin-title{display:flex;align-items:center;gap:7px;font-family:var(--font-head);font-size:.72rem;font-weight:600;letter-spacing:.5px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--t1)}
.fwin-title i{font-size:.68rem;opacity:.9}
.fwin-actions{display:flex;gap:4px;flex-shrink:0}
.fwin-act{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-size:.6rem;color:var(--t3);transition:background .15s,color .15s}
.fwin-act:hover{background:rgba(111,216,255,.12);color:var(--cy400)}

.fwin-body{flex:1;min-height:0;position:relative;border-radius:0 0 var(--r) var(--r);overflow:hidden;background:rgba(5,7,13,.4)}
.fwin-body iframe{width:100%;height:100%;border:none;display:block}
.fwin-loading{position:absolute;inset:0;display:grid;place-items:center;z-index:2;background:var(--bg0,#05070d);transition:opacity .3s}
.fwin-loading.done{opacity:0;pointer-events:none}
.fwin-loading .spinner{width:36px;height:36px;border-radius:50%;border:2.5px solid var(--t4);border-top-color:var(--cy400);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fwin-resize{position:absolute;right:3px;bottom:3px;width:16px;height:16px;cursor:nwse-resize;z-index:5;background:radial-gradient(circle at 100% 100%,rgba(111,216,255,.4) 0,transparent 55%);border-radius:0 0 var(--r) 0}

/*══════ TASKBAR ══════*/
.taskbar{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:500;display:flex;align-items:center;gap:5px;padding:7px 10px;background:var(--glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--glass-b);border-radius:16px;box-shadow:0 12px 44px -10px rgba(0,0,0,.7);max-width:92vw;overflow-x:auto;scrollbar-width:none}
.taskbar::-webkit-scrollbar{display:none}
.tb-brand{display:flex;align-items:center;gap:7px;padding:0 8px 0 4px;font-family:var(--font-head);font-size:.62rem;font-weight:700;letter-spacing:1px;color:var(--t2);white-space:nowrap;flex-shrink:0}
.tb-brand i{color:var(--cy400);font-size:.72rem}
.tb-sep{width:1px;height:22px;background:var(--t4);margin:0 3px;flex-shrink:0}
.tb-btn{display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:10px;font-size:.64rem;font-weight:600;color:var(--t2);transition:all .18s;white-space:nowrap;cursor:pointer;flex-shrink:0;animation:tbIn .25s var(--ease)}
@keyframes tbIn{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
.tb-btn:hover{background:rgba(111,216,255,.08);color:var(--t1)}
.tb-btn i{font-size:.68rem}
.tb-btn.open{color:var(--t1);background:rgba(111,216,255,.1);border:1px solid rgba(111,216,255,.18)}
.tb-btn.open::after{content:'';width:4px;height:4px;border-radius:50%;background:var(--cy400);margin-left:2px}
.tb-btn.minimized{color:var(--t3);opacity:.65}
.tb-live{display:flex;align-items:center;gap:5px;padding:0 6px;font-family:var(--font-mono);font-size:.56rem;color:var(--green);flex-shrink:0}
.tb-live .dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.tb-clock{display:flex;align-items:center;gap:6px;padding:0 8px;font-family:var(--font-mono);font-size:.62rem;color:var(--t2);flex-shrink:0}
.tb-clock i{color:var(--cy400);font-size:.6rem}
.tb-ws{font-family:var(--font-mono);font-size:.56rem;padding:0 6px;flex-shrink:0;transition:color .3s}
.tb-ws.on{color:var(--green)}
.tb-ws.off{color:var(--red)}
.menu-overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:49;display:none}
.menu-overlay.show{display:block}

/*══════ HINT ══════*/
.hint{position:fixed;bottom:66px;left:50%;transform:translateX(-50%);font-size:.56rem;color:var(--t3);font-family:var(--font-mono);letter-spacing:.5px;z-index:40;text-align:center;pointer-events:none;white-space:nowrap;background:rgba(5,7,13,.5);padding:4px 12px;border-radius:8px;backdrop-filter:blur(8px);transition:opacity .3s}

/*══════ VOICE COMMAND PANEL ══════*/
.voice-panel{position:fixed;left:16px;bottom:16px;z-index:300;width:340px;background:var(--glass);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid rgba(111,216,255,.2);border-radius:14px;box-shadow:0 16px 50px -12px rgba(0,0,0,.75),0 0 30px -12px rgba(111,216,255,.25);overflow:hidden;transition:box-shadow .25s}
.voice-panel:hover{box-shadow:0 16px 60px -12px rgba(0,0,0,.8),0 0 40px -10px rgba(111,216,255,.35)}
.voice-panel.collapsed .vp-body{display:none}
.voice-panel.collapsed{width:auto}
.vp-header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;border-bottom:1px solid rgba(111,216,255,.08);cursor:pointer;user-select:none}
.vp-title{display:flex;align-items:center;gap:8px;font-family:var(--font-head);font-size:.62rem;font-weight:700;letter-spacing:1.5px;color:#6fd8ff;text-shadow:0 0 14px rgba(111,216,255,.4)}
.vp-title i{font-size:.68rem}
.vp-right{display:flex;align-items:center;gap:8px}
.vp-status{font-family:var(--font-mono);font-size:.54rem;letter-spacing:.5px;color:var(--t3);transition:color .3s}
.vp-status.listening{color:#22c55e;animation:pulse 1.6s infinite}
.vp-status.sending{color:var(--am400)}
.vp-status.sent{color:#22c55e}
.vp-status.error{color:#ef4444}
.vp-toggle{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:.58rem;color:var(--t3);transition:all .15s;flex-shrink:0}
.vp-toggle:hover{background:rgba(111,216,255,.12);color:var(--cy400)}
.vp-body{padding:10px 12px 12px}
.vp-wave{display:flex;align-items:center;justify-content:center;gap:2px;height:30px;margin-bottom:8px}
.vp-wave .wb{width:2.5px;border-radius:2px;background:linear-gradient(to top,#6fd8ff,#22d3ee);will-change:height;transition:height .1s linear;box-shadow:0 0 6px rgba(111,216,255,.3)}
.vp-msgbox{display:flex;align-items:center;gap:6px;background:rgba(5,7,13,.6);border:1px solid rgba(111,216,255,.15);border-radius:9px;padding:0 6px;height:32px;transition:border-color .3s}
.vp-msgbox:focus-within{border-color:rgba(111,216,255,.5)}
.vp-msgbox input{flex:1;background:transparent;border:none;outline:none;color:var(--t1);font-size:.7rem;padding:0 .3rem;font-family:var(--font-mono)}
.vp-msgbox input::placeholder{color:var(--t3)}
.vp-snd{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#1e5a8a,#0e7490);color:#fff;display:grid;place-items:center;font-size:.58rem;transition:transform .15s,box-shadow .15s;flex-shrink:0}
.vp-snd:hover{transform:translateY(-1px);box-shadow:0 3px 10px -2px rgba(111,216,255,.4)}
.vp-mic{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:7px;background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.3);color:#4ade80;font-size:.56rem;font-weight:600;letter-spacing:.5px;transition:all .2s;flex-shrink:0}
.vp-mic:hover{background:rgba(34,197,94,.2)}
.vp-mic.listening{background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.4);color:#f87171;animation:pulse 1.4s infinite}
.vp-mic:disabled{opacity:.4;cursor:not-allowed}
.vp-log{min-height:0;max-height:76px;overflow-y:auto;margin-top:8px;font-family:var(--font-mono);font-size:.56rem;line-height:1.6;scrollbar-width:thin;scrollbar-color:var(--t4) transparent}
.vp-log::-webkit-scrollbar{width:3px}
.vp-log::-webkit-scrollbar-thumb{background:var(--t4);border-radius:3px}
.vp-log .vl{display:flex;gap:6px;padding:2px 0;border-bottom:1px solid rgba(111,216,255,.04);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vp-log .vl-t{color:var(--t3);flex-shrink:0}
.vp-log .vl-ok{color:#4ade80}
.vp-log .vl-err{color:#f87171}
.vp-log .vl-info{color:var(--t2)}

/*══════ RIGHT DOCK + MISSION PANEL ══════*/
.r-dock{position:fixed;right:14px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;z-index:50}
.r-dock-btn{width:46px;height:46px;border-radius:13px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--glass-b);display:grid;place-items:center;font-size:.95rem;color:var(--t2);transition:all .2s;box-shadow:0 6px 24px -8px rgba(0,0,0,.6);position:relative}
.r-dock-btn:hover{transform:translateX(-3px);color:var(--t1);border-color:rgba(111,216,255,.4)}
.r-dock-btn.on{background:rgba(111,216,255,.14);border-color:rgba(111,216,255,.45);color:#6fd8ff;box-shadow:0 0 24px -6px rgba(111,216,255,.5)}
.r-dock-btn .rd-badge{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;border-radius:8px;background:#ef4444;color:#fff;font-size:.5rem;font-weight:700;display:grid;place-items:center;padding:0 3px;font-family:var(--font-mono)}
.r-dock-btn .rd-label{position:absolute;right:calc(100% + 10px);top:50%;transform:translateY(-50%);white-space:nowrap;background:var(--glass);border:1px solid var(--glass-b);border-radius:8px;padding:5px 10px;font-family:var(--font-head);font-size:.6rem;font-weight:600;letter-spacing:1px;color:var(--t1);opacity:0;pointer-events:none;transition:opacity .18s}
.r-dock-btn:hover .rd-label{opacity:1}

.m-panel{position:fixed;right:70px;top:50%;transform:translateY(-50%) translateX(12px);width:360px;max-height:min(560px,calc(100vh - 140px));background:var(--glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(111,216,255,.22);border-radius:16px;box-shadow:0 24px 70px -14px rgba(0,0,0,.8),0 0 44px -12px rgba(111,216,255,.25);display:flex;flex-direction:column;z-index:60;opacity:0;pointer-events:none;transform-origin:right center;transition:opacity .25s var(--ease),transform .25s var(--ease)}
.m-panel.open{opacity:1;pointer-events:auto;transform:translateY(-50%) translateX(0)}
.m-head{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid rgba(111,216,255,.1);flex-shrink:0}
.m-head-ico{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#1e5a8a,#0e7490);display:grid;place-items:center;font-size:.62rem;color:#fff;flex-shrink:0}
.m-head-title{font-family:var(--font-head);font-size:.66rem;font-weight:700;letter-spacing:1.2px;color:#6fd8ff;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-head-x{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:.6rem;color:var(--t3);transition:all .15s}
.m-head-x:hover{background:rgba(239,68,68,.15);color:#f87171}
.m-body{flex:1;min-height:0;overflow-y:auto;padding:10px 12px;scrollbar-width:thin;scrollbar-color:var(--t4) transparent}
.m-body::-webkit-scrollbar{width:4px}
.m-body::-webkit-scrollbar-thumb{background:var(--t4);border-radius:4px}
.m-foot{display:flex;gap:4px;padding:7px 10px;border-top:1px solid rgba(111,216,255,.08);flex-shrink:0}
.m-tab{flex:1;padding:5px 4px;border-radius:7px;font-family:var(--font-mono);font-size:.54rem;letter-spacing:.5px;color:var(--t3);transition:all .15s;text-align:center;font-weight:600}
.m-tab:hover{color:var(--t1)}
.m-tab.on{background:rgba(111,216,255,.12);color:#6fd8ff}

/*─ shared view items ─*/
.sv-empty{font-family:var(--font-mono);font-size:.58rem;color:var(--t3);text-align:center;padding:1.2rem 0}
.sv-card{background:rgba(5,7,13,.45);border:1px solid rgba(111,216,255,.08);border-radius:10px;padding:8px 10px;margin-bottom:7px}
.sv-card-h{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:5px}
.sv-nm{font-family:var(--font-head);font-size:.66rem;font-weight:600;color:var(--t1);display:flex;align-items:center;gap:6px;min-width:0}
.sv-nm i{font-size:.6rem;opacity:.8}
.sv-st{font-size:.52rem;font-weight:700;letter-spacing:.5px;padding:2px 7px;border-radius:10px;flex-shrink:0}
.sv-st.active{background:rgba(34,197,94,.12);color:#4ade80;border:1px solid rgba(34,197,94,.25)}
.sv-st.idle{background:rgba(100,116,139,.12);color:#94a3b8;border:1px solid rgba(100,116,139,.25)}
.sv-st.running{background:rgba(59,130,246,.12);color:#60a5fa;border:1px solid rgba(59,130,246,.25)}
.sv-st.error{background:rgba(239,68,68,.12);color:#f87171;border:1px solid rgba(239,68,68,.25)}
.sv-bar{height:4px;background:rgba(111,216,255,.07);border-radius:3px;overflow:hidden;margin:3px 0}
.sv-bf{height:100%;border-radius:3px;background:linear-gradient(90deg,#0e7490,#22d3ee);transition:width .7s var(--ease)}
.sv-meta{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:.52rem;color:var(--t3);margin-top:3px}
.sv-meta b{color:var(--cy400);font-weight:600}
.sv-log{font-family:var(--font-mono);font-size:.56rem;line-height:1.7;padding:2px 0;border-bottom:1px solid rgba(111,216,255,.04);display:flex;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sv-log .lt{color:var(--t3);flex-shrink:0}
.sv-log .la{color:#6fd8ff;flex-shrink:0}
.sv-log .INFO{color:#94a3b8}
.sv-log .OK{color:#4ade80}
.sv-log .ERROR{color:#f87171}
.sv-log .WARN{color:#fbbf24}
.sv-hstat{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:7px}
.sv-hcell{background:rgba(5,7,13,.45);border:1px solid rgba(111,216,255,.08);border-radius:10px;padding:8px 10px}
.sv-hv{font-family:var(--font-head);font-size:.95rem;font-weight:700;color:var(--t1);line-height:1.2}
.sv-hv small{font-size:.55rem;color:var(--t3);font-weight:500}
.sv-hl{font-size:.52rem;color:var(--t3);text-transform:uppercase;letter-spacing:.8px;margin-top:2px}

/*══════ WS INDICATOR ══════*/
#ws-ind{position:fixed;top:14px;right:240px;font-family:var(--font-mono);font-size:.6rem;color:var(--green);letter-spacing:1px;z-index:50;text-shadow:0 0 10px rgba(74,222,128,.4);pointer-events:none}
#ws-ind.off{color:var(--red);text-shadow:0 0 10px rgba(248,113,113,.4)}

/*══════ RESPONSIVE ══════*/
@media(max-width:768px){
  .launcher{top:auto;bottom:70px;right:50%;transform:translateX(50%)}
  .launch-btn .lb-txt small{display:none}
  .tb-brand{display:none}
  .m-panel{right:10px;width:calc(100vw - 20px);max-height:70vh}
  .r-dock{right:8px}
  .voice-panel{left:8px;bottom:70px;width:calc(100vw - 16px)}
  #ws-ind{right:8px;top:auto;bottom:120px}
  .hint{display:none}
}

/*══════ GLOW BURST ══════*/
.win-burst{position:fixed;width:120px;height:120px;border-radius:50%;pointer-events:none;z-index:99;background:radial-gradient(circle,rgba(111,216,255,.28),transparent 65%);transform:translate(-50%,-50%) scale(0);opacity:0;transition:transform .5s ease-out,opacity .5s ease-out}
.win-burst.pop{transform:translate(-50%,-50%) scale(1);opacity:1}
.win-burst.fade{opacity:0;transform:translate(-50%,-50%) scale(1.6)}
</style>
</head>
<body>

<!-- ══════ ORB CANVAS (Three.js background) ══════ -->
<canvas id="orb-canvas"></canvas>
<div class="orb-dim" id="orbDim"></div>

<!-- ══════ LAUNCNER ══════ -->
<div class="launcher">
  <button class="launch-btn" id="menuLauncher" title="Open Menu">
    <span class="lb-ico" style="background:linear-gradient(135deg,#6fd8ff,#8b5cf6)"><i class="fas fa-bars"></i></span>
    <span class="lb-txt">MENU<small>All Apps</small></span>
  </button>

<!-- ══════ THREE.JS CDN ══════ -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
/*══════════════════════════════════════════════════════════
  FUSION v2 — UNIFIED ENGINE
  ORB 3D background + floating windows + all apps + data
══════════════════════════════════════════════════════════*/
(function(){
'use strict';

/*────────────────────────────────────────────────
  1. THREE.JS ORBCENE (direct embedding, no iframe)
  ────────────────────────────────────────────────*/
(function initOrb(){
const canvas = document.getElementById('orb-canvas');
if (!canvas || typeof THREE === 'undefined') return;
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.z = 7;

// Lighting
scene.add(new THREE.AmbientLight(0x334466, 0.6));
const pointLight = new THREE.PointLight(0x6fd8ff, 1.2, 30);
pointLight.position.set(5, 3, 5);
scene.add(pointLight);
const backLight = new THREE.PointLight(0x9b6dff, 0.5, 30);
backLight.position.set(-5, -3, -5);
scene.add(backLight);

// Orb group
const group = new THREE.Group();
scene.add(group);

const shellMat = new THREE.MeshBasicMaterial({ color: 0x6fd8ff, wireframe: true, transparent: true, opacity: 0.25 });
const shell1 = new THREE.Mesh(new THREE.SphereGeometry(2.2, 24, 24), shellMat);
group.add(shell1);

const shellMat2 = new THREE.MeshBasicMaterial({ color: 0x9b6dff, wireframe: true, transparent: true, opacity: 0.15 });
const shell2 = new THREE.Mesh(new THREE.SphereGeometry(2.6, 20, 20), shellMat2);
shell2.rotation.x = Math.PI / 6;
group.add(shell2);

const coreMat = new THREE.MeshBasicMaterial({ color: 0x6fd8ff, transparent: true, opacity: 0.12 });
const core = new THREE.Mesh(new THREE.SphereGeometry(1.5, 32, 32), coreMat);
group.add(core);

const ringGeom = new THREE.TorusGeometry(3.2, 0.03, 8, 64);
const ringMat = new THREE.MeshBasicMaterial({ color: 0x6fd8ff, transparent: true, opacity: 0.35 });
const ring = new THREE.Mesh(ringGeom, ringMat);
ring.rotation.x = Math.PI / 2.4;
group.add(ring);

const ring2 = new THREE.Mesh(new THREE.TorusGeometry(3.6, 0.015, 8, 64),
  new THREE.MeshBasicMaterial({ color: 0x9b6dff, transparent: true, opacity: 0.2 }));
ring2.rotation.x = Math.PI / 1.8;
ring2.rotation.y = Math.PI / 5;
group.add(ring2);

// Particles
const particles = new THREE.BufferGeometry();
const COUNT = 600;
const pos = new Float32Array(COUNT * 3);
for (let i = 0; i < COUNT; i++) {
  const r = 3.5 + Math.random() * 4;
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  pos[i*3] = r * Math.sin(phi) * Math.cos(theta);
  pos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
  pos[i*3+2] = r * Math.cos(phi);
}
particles.setAttribute('position', new THREE.BufferAttribute(pos, 3));
const pm = new THREE.PointsMaterial({ color: 0x6fd8ff, size: 0.03, transparent: true, opacity: 0.6 });
const pPoints = new THREE.Points(particles, pm);
scene.add(pPoints);

// Interaction
let isDragging = false, prevX = 0, prevY = 0;
let rotX = 0, rotY = 0, zoom = 7;

canvas.addEventListener('mousedown', (e) => { isDragging = true; prevX = e.clientX; prevY = e.clientY; });
window.addEventListener('mouseup', () => { isDragging = false; });
window.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  rotY += (e.clientX - prevX) * 0.005;
  rotX += (e.clientY - prevY) * 0.005;
  prevX = e.clientX; prevY = e.clientY;
});
canvas.addEventListener('wheel', (e) => {
  zoom = Math.max(4, Math.min(12, zoom + e.deltaY * 0.005));
  e.preventDefault();
}, { passive: false });
canvas.addEventListener('touchstart', (e) => {
  if (e.touches.length === 1) { isDragging = true; prevX = e.touches[0].clientX; prevY = e.touches[0].clientY; }
}, { passive: true });
canvas.addEventListener('touchend', () => { isDragging = false; }, { passive: true });
canvas.addEventListener('touchmove', (e) => {
  if (!isDragging || e.touches.length !== 1) return;
  const t = e.touches[0];
  rotY += (t.clientX - prevX) * 0.005;
  rotX += (t.clientY - prevY) * 0.005;
  prevX = t.clientX; prevY = t.clientY;
}, { passive: true });

// Animation loop
function animate() {
  requestAnimationFrame(animate);
  group.rotation.x += (rotX - group.rotation.x) * 0.08;
  group.rotation.y += (rotY - group.rotation.y) * 0.08;
  group.rotation.y += 0.001;
  shell1.rotation.y += 0.002;
  shell2.rotation.y -= 0.0015;
  ring.rotation.z += 0.003;
  ring2.rotation.z -= 0.002;
  pPoints.rotation.y += 0.0005;
  camera.position.z += (zoom - camera.position.z) * 0.08;
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
})();

/*────────────────────────────────────────────────
  2. FLOATING WINDOW ENGINE
  ────────────────────────────────────────────────*/
const APPS = {
  dashboard:      { url:'/dashboard',                title:'AgentOS Dashboard',  ico:'fa-table-columns',  accent:'#4f46e5', w:860, h:600 },
  aios:           { url:'/aios',                     title:'AIOS Holographic',   ico:'fa-user-astronaut', accent:'#f59e0b', w:900, h:640 },
  ecosystem:      { url:'/dashboard#ecosystem',      title:'Ecosystem Overview', ico:'fa-globe',          accent:'#22d3ee', w:840, h:580 },
  swarm:          { url:'/dashboard#swarm',          title:'Swarm Topology',     ico:'fa-network-wired',  accent:'#8b5cf6', w:840, h:580 },
  taskqueue:      { url:'/dashboard#taskqueue',      title:'Task Kanban',        ico:'fa-list-check',     accent:'#22c55e', w:880, h:620 },
  terminal:       { url:'/dashboard#terminal',       title:'Terminal Hub',       ico:'fa-terminal',       accent:'#f97316', w:800, h:540 },
  telegram:       { url:'/dashboard#telegram',       title:'Telegram Bridge',    ico:'fa-paper-plane',    accent:'#38bdf8', w:840, h:600 },
  storage:        { url:'/dashboard#storage',        title:'USB & Storage',      ico:'fa-hard-drive',     accent:'#e2e8f0', w:800, h:540 },
  skills:         { url:'/dashboard#skills',         title:'Skill Monitor',      ico:'fa-brain',          accent:'#f472b6', w:840, h:580 },
  'skills-market':{ url:'/dashboard#skills-market',  title:'Skill Market',       ico:'fa-store',          accent:'#a3e635', w:840, h:580 },
  system:         { url:'/dashboard#system',         title:'System Config',      ico:'fa-sliders',        accent:'#94a3b8', w:820, h:560 },
  cost:           { url:'/dashboard#cost',           title:'Cost Tracking',      ico:'fa-coins',          accent:'#fbbf24', w:800, h:540 },
  deploy:         { url:'/dashboard#deploy',         title:'Vercel Deploy',      ico:'fa-rocket',         accent:'#60a5fa', w:800, h:540 },
};

const mount = document.getElementById('winMount');
const orbDim = document.getElementById('orbDim');
const taskbar = document.getElementById('taskbar');
let zTop = 100;
const openApps = new Set();

// Clock
setInterval(() => {
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-US',{hour12:false});
}, 1000);

function cascadePos(idx) {
  const vw = window.innerWidth, vh = window.innerHeight;
  const baseW = Math.min(880, vw-60), baseH = Math.min(600, vh-100);
  const x = Math.max(20, (vw - baseW)/2 + (idx-1)*30 - 60);
  const y = Math.max(20, (vh - baseH)/2 + (idx-1)*20 - 40);
  return { x, y, w: baseW, h: baseH };
}

function burst(x, y) {
  const b = document.createElement('div');
  b.className = 'win-burst';
  b.style.left = x+'px'; b.style.top = y+'px';
  document.body.appendChild(b);
  requestAnimationFrame(() => requestAnimationFrame(() => b.classList.add('pop')));
  setTimeout(() => b.classList.add('fade'), 220);
  setTimeout(() => b.remove(), 750);
}

function openWindow(appId) {
  if (openApps.has(appId)) { focusWindow(appId); return; }
  const cfg = APPS[appId];
  if (!cfg) return;

  openApps.add(appId);
  orbDim.classList.add('show');
  const idx = openApps.size;
  const pos = cascadePos(idx);
  burst(window.innerWidth/2, window.innerHeight/2);

  const win = document.createElement('div');
  win.className = 'fwin';
  win.dataset.app = appId;
  win.style.left = pos.x+'px'; win.style.top = pos.y+'px';
  win.style.width = Math.min(cfg.w, window.innerWidth-40)+'px';
  win.style.height = Math.min(cfg.h, window.innerHeight-90)+'px';

  win.innerHTML =
    `<div class="fwin-bar">
       <div class="fwin-dots">
         <div class="fdot fdot-close" data-act="close" title="Tutup"></div>
         <div class="fdot fdot-min" data-act="min" title="Minimize"></div>
         <div class="fdot fdot-max" data-act="max" title="Maximize"></div>
       </div>
       <div class="fwin-title"><i class="fas ${cfg.ico}" style="color:${cfg.accent}"></i>${cfg.title}</div>
       <div class="fwin-actions">
         <button class="fwin-act" data-act="min" title="Minimize"><i class="fas fa-minus"></i></button>
         <button class="fwin-act" data-act="max" title="Maximize"><i class="fas fa-expand"></i></button>
         <button class="fwin-act" data-act="close" title="Close"><i class="fas fa-xmark"></i></button>
       </div>
     </div>
     <div class="fwin-body">
       <div class="fwin-loading"><div class="spinner"></div></div>
       <iframe src="${cfg.url}" loading="lazy"></iframe>
     </div>
     <div class="fwin-resize"></div>`;

  mount.appendChild(win);
  zTop++;
  win.style.zIndex = zTop;
  focusWindow(appId);
  requestAnimationFrame(() => requestAnimationFrame(() => win.classList.add('open')));

  // Loader + smart de-dup
  const iframe = win.querySelector('iframe');
  iframe.addEventListener('load', () => {
    const ld = win.querySelector('.fwin-loading');
    if (ld) setTimeout(() => ld.classList.add('done'), 250);
    // De-dup after load: hide chrome/nav, keep content
    setTimeout(() => dedupApp(appId, iframe), 500);
  });
  setTimeout(() => {
    const ld = win.querySelector('.fwin-loading');
    if (ld) ld.classList.add('done');
  }, 8000);

  // Titlebar controls
  win.querySelectorAll('[data-act]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const act = btn.dataset.act;
      if (act === 'close') closeWindow(appId);
      else if (act === 'min') minimizeWindow(appId);
      else if (act === 'max') toggleMax(appId);
    });
  });

  // Drag
  const bar = win.querySelector('.fwin-bar');
  let dragging = false, dx0 = 0, dy0 = 0, ox = 0, oy = 0;
  bar.addEventListener('mousedown', e => {
    if (e.target.closest('[data-act]')) return;
    dragging = true;
    const r = win.getBoundingClientRect();
    ox = r.left; oy = r.top;
    dx0 = e.clientX; dy0 = e.clientY;
    bar.style.cursor = 'grabbing';
    e.preventDefault();
  });
  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    const nx = ox + (e.clientX - dx0);
    const ny = oy + (e.clientY - dy0);
    win.style.left = Math.max(-win.offsetWidth+80, Math.min(nx, window.innerWidth-80))+'px';
    win.style.top  = Math.max(0, Math.min(ny, window.innerHeight-60))+'px';
  });
  document.addEventListener('mouseup', () => { dragging = false; bar.style.cursor = 'grab'; });

  // Resize
  const rz = win.querySelector('.fwin-resize');
  let resizing = false, rx0 = 0, ry0 = 0, rw0 = 0, rh0 = 0;
  rz.addEventListener('mousedown', e => {
    resizing = true;
    rx0 = e.clientX; ry0 = e.clientY;
    rw0 = win.offsetWidth; rh0 = win.offsetHeight;
    e.preventDefault(); e.stopPropagation();
  });
  document.addEventListener('mousemove', e => {
    if (!resizing) return;
    win.style.width  = Math.max(340, rw0 + (e.clientX - rx0))+'px';
    win.style.height = Math.max(240, rh0 + (e.clientY - ry0))+'px';
  });
  document.addEventListener('mouseup', () => { resizing = false; });

  // Click → focus
  win.addEventListener('mousedown', () => focusWindow(appId), true);

  // Dynamic taskbar + menu state
  addTaskbarBtn(appId);
  updateDim();
}

function addTaskbarBtn(appId) {
  if (taskbar.querySelector(`.tb-btn[data-app="${appId}"]`)) return;
  const cfg = APPS[appId];
  const sep = document.createElement('div');
  sep.className = 'tb-sep';
  const btn = document.createElement('div');
  btn.className = 'tb-btn open';
  btn.dataset.app = appId;
  btn.innerHTML = `<i class="fas ${cfg.ico}" style="color:${cfg.accent}"></i>${cfg.title.toUpperCase()}`;
  btn.addEventListener('click', () => {
    const win = mount.querySelector(`.fwin[data-app="${appId}"]`);
    if (!win) return;
    if (win.classList.contains('minimized')) restoreWindow(appId);
    else if (win.classList.contains('focused')) minimizeWindow(appId);
    else focusWindow(appId);
  });
 
  // Insert before the live indicator
  const liveEl = taskbar.querySelector('.tb-live');
  if (liveEl) {
    taskbar.insertBefore(sep, liveEl);
    taskbar.insertBefore(btn, liveEl);
  } else {
    taskbar.appendChild(sep);
    taskbar.appendChild(btn);
  }
}

function removeTaskbarBtn(appId) {
  const btn = taskbar.querySelector(`.tb-btn[data-app="${appId}"]`);
  if (btn) {
    const sep = btn.previousElementSibling;
    if (sep && sep.classList.contains('tb-sep')) sep.remove();
    btn.remove();
  }
}

function focusWindow(appId) {
  const win = mount.querySelector(`.fwin[data-app="${appId}"]`);
  if (!win) return;
  if (win.classList.contains('minimized')) { restoreWindow(appId); return; }
  zTop = Math.min(zTop + 1, 9999);
  if (zTop > 9900) zTop = 200; // reset to avoid overflow
  win.style.zIndex = zTop;
  win.classList.add('focused');
  mount.querySelectorAll('.fwin').forEach(w => { if (w !== win) w.classList.remove('focused'); });
  taskbar.querySelectorAll('.tb-btn').forEach(b => b.classList.toggle('open', b.dataset.app === appId));
}

function closeWindow(appId) {
  const win = mount.querySelector(`.fwin[data-app="${appId}"]`);
  if (!win) return;
  win.classList.remove('open');
  win.classList.add('closing');
  setTimeout(() => win.remove(), 280);
  openApps.delete(appId);
  removeTaskbarBtn(appId);
  updateDim();
}

function minimizeWindow(appId) {
  const win = mount.querySelector(`.fwin[data-app="${appId}"]`);
  if (!win) return;
  win.classList.add('minimized');
  win.classList.remove('focused');
  const btn = taskbar.querySelector(`.tb-btn[data-app="${appId}"]`);
  if (btn) { btn.classList.remove('open'); btn.classList.add('minimized'); }
}

function restoreWindow(appId) {
  const win = mount.querySelector(`.fwin[data-app="${appId}"]`);
  if (!win) return;
  win.classList.remove('minimized');
  const btn = taskbar.querySelector(`.tb-btn[data-app="${appId}"]`);
  if (btn) btn.classList.remove('minimized');
  focusWindow(appId);
}

function toggleMax(appId) {
  const win = mount.querySelector(`.fwin[data-app="${appId}"]`);
  if (!win) return;
  if (win.dataset.max === '1') {
    win.style.left = win.dataset.px; win.style.top = win.dataset.py;
    win.style.width = win.dataset.pw; win.style.height = win.dataset.ph;
    win.dataset.max = '0';
  } else {
    win.dataset.px = win.style.left; win.dataset.py = win.style.top;
    win.dataset.pw = win.style.width; win.dataset.ph = win.style.height;
    win.style.left = '0'; win.style.top = '0';
    win.style.width = '100vw'; win.style.height = '100vh';
    win.dataset.max = '1';
    zTop++; win.style.zIndex = zTop;
    win.classList.add('focused');
  }
}

function updateDim() {
  orbDim.classList.toggle('show', openApps.size > 0);
}

//── Smart de-dup: hide chrome/navigation, preserve content ──
function dedupApp(appId, iframe) {
  try {
    const doc = iframe.contentDocument;
    if (!doc) return;

    // Dashboard: hide sidebar + topnav + dedup buttons, preserve content
    if (appId === 'dashboard' || appId === 'ecosystem' || appId === 'swarm' ||
        appId === 'taskqueue' || appId === 'terminal' || appId === 'telegram' ||
        appId === 'storage' || appId === 'skills' || appId === 'skills-market' ||
        appId === 'system' || appId === 'cost' || appId === 'deploy') {
      const sidebar = doc.querySelector('.sidebar');
      if (sidebar) sidebar.style.display = 'none';
      const topnav = doc.querySelector('.topnav');
      if (topnav) topnav.style.display = 'none';
      const mainContent = doc.querySelector('.main-content');
      if (mainContent) mainContent.style.marginLeft = '0';
      const wsRecBtn = doc.querySelector('#wsRecBtn');
      if (wsRecBtn) wsRecBtn.style.display = 'none';
      const searchBar = doc.querySelector('.search-bar');
      if (searchBar) searchBar.style.display = 'none';
    }

    // AIOS: hide header + left/right panels, keep center canvas + dock
    if (appId === 'aios') {
      const header = doc.querySelector('.hdr');
      if (header) header.style.display = 'none';
      const pLeft = doc.querySelector('#pLeft');
      if (pLeft) pLeft.style.display = 'none';
      const pRight = doc.querySelector('#pRight');
      if (pRight) pRight.style.display = 'none';
      // Re-layout center to fill
      const ctr = doc.querySelector('.ctr');
      if (ctr) ctr.style.gridColumn = '1 / -1';
      const main = doc.querySelector('.main');
      if (main) main.style.gridTemplateColumns = '1fr';
    }
  } catch(e) {
    // Cross-origin iframe error — silently ignore
  }
}

//── Launchers ──
document.querySelectorAll('.launch-btn[data-app]').forEach(btn => {
  btn.addEventListener('click', () => {
    const app = btn.dataset.app;
    toggleApp(app);
  });
});

//── Menu launcher (hamburger) ──
const menuLauncher = document.getElementById('menuLauncher');
const menuOverlay = document.getElementById('menuOverlay');
let menuOpen = false;

function createAppMenu() {
  const existing = document.querySelector('.app-menu');
  if (existing) existing.remove();

  const menu = document.createElement('div');

    position:fixed; top:60px; right:14px; z-index:500;
    background:var(--glass); backdrop-filter:blur(24px);
    border:1px solid var(--glass-b); border-radius:14px;
    padding:8px; min-width:220px;
    box-shadow:0 18px 50px -12px rgba(0,0,0,.85);
    display:none; flex-direction:column; gap:2px;
    max-height:calc(100vh - 80px); overflow-y:auto;
  `;

  const items = [
    { app:'dashboard', icon:'fa-table-columns', label:'Dashboard', color:'#4f46e5' },
    { app:'aios', icon:'fa-user-astronaut', label:'AIOS Holographic', color:'#f59e0b' },
    { sep:true },
    { app:'ecosystem', icon:'fa-globe', label:'Ecosystem', color:'#22d3ee' },
    { app:'swarm', icon:'fa-network-wired', label:'Swarm Topology', color:'#8b5cf6' },
    { app:'taskqueue', icon:'fa-list-check', label:'Task Kanban', color:'#22c55e' },
    { app:'terminal', icon:'fa-terminal', label:'Terminal Hub', color:'#f97316' },
    { app:'telegram', icon:'fa-paper-plane', label:'Telegram Bridge', color:'#38bdf8' },
    { sep:true },
    { app:'storage', icon:'fa-hard-drive', label:'USB & Storage', color:'#e2e8f0' },
    { app:'skills', icon:'fa-brain', label:'Skill Monitor', color:'#f472b6' },
    { app:'skills-market', icon:'fa-store', label:'Skill Market', color:'#a3e635' },
    { app:'system', icon:'fa-sliders', label:'System Config', color:'#94a3b8' },
    { app:'cost', icon:'fa-coins', label:'Cost Tracking', color:'#fbbf24' },
    { app:'deploy', icon:'fa-rocket', label:'Vercel Deploy', color:'#60a5fa' },
  ];

  menu.innerHTML = items.map(it => {
    if (it.sep) return '<div style="height:1px;background:var(--t4);margin:5px 8px"></div>';
    const on = openApps.has(it.app) ? ' on' : '';
    return `<div class="m-item${on}" data-app="${it.app}">
      <span class="mi" style="color:${it.color}"><i class="fas ${it.icon}"></i></span>
      <span class="mi-label">${it.label}</span>
      <span class="mi-badge" style="display:none;margin-left:auto;font-size:.5rem;color:var(--cy400)">●</span>
    </div>`;
  }).join('');

  // Style menu items
  const style = document.createElement('style');
  style.textContent = `
    .m-item {
      display:flex; align-items:center; gap:10px;
      padding:7px 10px; border-radius:8px; cursor:pointer;
      font-size:.72rem; color:var(--t2); white-space:nowrap;
      transition:all .15s; user-select:none;
    }
    .m-item:hover { background:rgba(111,216,255,.1); color:var(--t1); }
    .m-item.on { background:rgba(111,216,255,.12); color:var(--t1); }
    .m-item .mi { width:20px; text-align:center; font-size:.8rem; flex-shrink:0; }
    .m-item .mi-label { flex:1; }
    .m-item.on .mi-badge { display:inline !important; }
  `;
  menu.appendChild(style);

  menu.querySelectorAll('.m-item').forEach(it => {
    it.addEventListener('click', () => {
      toggleApp(it.dataset.app);
      closeMenu();
    });
  });

  document.body.appendChild(menu);
  return menu;
}

let appMenu = null;

function toggleMenu() {
  menuOpen = !menuOpen;
  if (!appMenu || !document.body.contains(appMenu)) {
    appMenu = createAppMenu();
  }
  appMenu.style.display = menuOpen ? 'flex' : 'none';
  menuOverlay.classList.toggle('show', menuOpen);
}

function closeMenu() {
  menuOpen = false;
  if (appMenu) appMenu.style.display = 'none';
  menuOverlay.classList.remove('show');
}

menuLauncher.addEventListener('click', (e) => {
  e.stopPropagation();
  toggleMenu();
});

menuOverlay.addEventListener('click', closeMenu);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMenu(); });

function updateMenuState(appId, isOpen) {
  if (!appMenu) return;
  const item = appMenu.querySelector(`.m-item[data-app="${appId}"]`);
  if (!item) return;
  item.classList.toggle('on', isOpen);
  const badge = item.querySelector('.mi-badge');
  if (badge) badge.style.display = isOpen ? 'inline' : 'none';
}

function toggleApp(appId) {
  const win = mount.querySelector(`.fwin[data-app="${appId}"]`);
  if (win) {
    if (win.classList.contains('minimized')) restoreWindow(appId);
    else if (win.classList.contains('focused')) minimizeWindow(appId);
    else focusWindow(appId);
  } else {
    openWindow(appId);
  }
}

//── Taskbar click ──
taskbar.addEventListener('click', e => {
  const btn = e.target.closest('.tb-btn[data-app]');
  if (!btn) return;
  toggleApp(btn.dataset.app);
});

//── Expose for cross-frame use ──
window.__openApp = openWindow;

/*────────────────────────────────────────────────
  3. VOICE COMMAND PANEL
  ────────────────────────────────────────────────*/
(function voicePanel() {
  const vpInput = document.getElementById('vpInput');
  const vpSnd = document.getElementById('vpSnd');
  const vpMic = document.getElementById('vpMic');
  const vpStatus = document.getElementById('vpStatus');
  const vpLog = document.getElementById('vpLog');
  const vpWave = document.getElementById('vpWave');
  const vpPanel = document.getElementById('voicePanel');
  const vpToggle = document.getElementById('vpToggle');
  const vpHeader = document.getElementById('vpHeader');

  // Waveform bars
  if (vpWave) {
    const frag = document.createDocumentFragment();
    for (let i = 0; i < 24; i++) {
      const b = document.createElement('div');
      b.className = 'wb';
      b.style.height = '15%';
      frag.appendChild(b);
    }
    vpWave.appendChild(frag);
    let audioLvl = 0.4;
    setInterval(() => { audioLvl = 0.25 + Math.random() * 0.5; }, 1400);
    (function tickWave() {
      const bars = vpWave.children;
      const t = performance.now() * 0.004;
      for (let i = 0, l = bars.length; i < l; i++) {
        bars[i].style.height = (12 + Math.sin(t + i * 0.45) * 26 * audioLvl + Math.random() * 9 * audioLvl) + '%';
      }
      requestAnimationFrame(tickWave);
    })();
  }

  function setStatus(txt, cls) {
    vpStatus.textContent = txt;
    vpStatus.className = 'vp-status' + (cls ? ' ' + cls : '');
  }

  function vlog(msg, cls) {
    const d = document.createElement('div');
    d.className = 'vl';
    d.innerHTML = `<span class="vl-t">${new Date().toLocaleTimeString('en-US',{hour12:false})}</span><span class="vl-${cls||'info'}">${msg.replace(/</g,'&lt;')}</span>`;
    vpLog.insertBefore(d, vpLog.firstChild);
    while (vpLog.children.length > 6) vpLog.removeChild(vpLog.lastChild);
  }

  async function sendCmd() {
    const v = vpInput.value.trim();
    if (!v) return;
    vpInput.value = '';
    setStatus('SENDING...', 'sending');
    vlog('→ kirim: ' + v, 'info');
    try {
      const r = await fetch('/api/mc/send-telegram', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: v, topic_id: '1' }),
        signal: AbortSignal.timeout(60000),
      });
      const data = await r.json();
      if (data && data.status === 'sent') {
        setStatus('SENT → #GENERAL', 'sent');
        vlog('✓ terkirim ke #General', 'ok');
      } else {
        setStatus('GAGAL', 'error');
        vlog('✗ ' + (data?.message || 'unknown error'), 'err');
      }
    } catch(e) {
      setStatus('GAGAL', 'error');
      vlog('✗ ' + e.message, 'err');
    }
    setTimeout(() => setStatus('STANDBY'), 3000);
  }

  vpSnd.addEventListener('click', sendCmd);
  vpInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendCmd(); });

  // Voice input
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null, listening = false;
  if (!SR) {
    vpMic.disabled = true;
    vpMic.title = 'Voice tidak didukung browser ini';
    vpMic.style.opacity = '0.4';
  }

  vpMic.addEventListener('click', () => {
    if (!SR) return;
    if (listening) stopListen();
    else startListen();
  });

  function startListen() {
    try {
      recognition = new SR();
      recognition.lang = 'id-ID';
      recognition.interimResults = false;
      recognition.onresult = ev => {
        const t = ev.results[0][0].transcript;
        vpInput.value = t;
        vlog('🎤 "' + t + '"', 'info');
        sendCmd();
      };
      recognition.onerror = () => stopListen();
      recognition.onend = () => stopListen();
      recognition.start();
      listening = true;
      vpMic.classList.add('listening');
      vpMic.innerHTML = '<i class="fas fa-stop" style="font-size:.45rem"></i>STOP';
      setStatus('LISTENING...', 'listening');
    } catch(e) { stopListen(); }
  }

  function stopListen() {
    listening = false;
    try { if (recognition) recognition.stop(); } catch(e) {}
    vpMic.classList.remove('listening');
    vpMic.innerHTML = '<i class="fas fa-circle" style="font-size:.45rem"></i>MIC';
    setStatus('STANDBY');
  }

  // Collapse/expand
  let collapsed = false;
  vpToggle.addEventListener('click', e => {
    e.stopPropagation();
    collapsed = !collapsed;
    vpPanel.classList.toggle('collapsed', collapsed);
    vpToggle.innerHTML = collapsed ? '<i class="fas fa-chevron-up"></i>' : '<i class="fas fa-chevron-down"></i>';
  });
  vpHeader.addEventListener('click', e => {
    if (e.target.closest('.vp-toggle, .vp-right')) return;
    collapsed = !collapsed;
    vpPanel.classList.toggle('collapsed', collapsed);
    vpToggle.innerHTML = collapsed ? '<i class="fas fa-chevron-up"></i>' : '<i class="fas fa-chevron-down"></i>';
  });

  vlog('Voice Command siap — mic atau ketik perintah', 'info');
})();

/*────────────────────────────────────────────────
  4. MISSION PANEL — shared views with fallback data
  ────────────────────────────────────────────────*/
(function missionPanel() {
  const mPanel = document.getElementById('mPanel');
  const mBody = document.getElementById('mBody');
  const mTitle = document.getElementById('mTitle');
  const mIco = document.getElementById('mIco');
  const mClose = document.getElementById('mClose');

  const VIEWS = {
    threads: { title: 'THREAD ORCHESTRATOR', ico: 'fa-diagram-project' },
    swarm:   { title: 'SWARM NETWORK',        ico: 'fa-network-wired' },
    feed:    { title: 'LIVE ACTIVITY FEED',    ico: 'fa-stream' },
    health:  { title: 'SYSTEM HEALTH',         ico: 'fa-heart-pulse' },
  };

  let curView = null, refreshTimer = null;
  let feedCount = 0;

  // Fallback data when API is offline
  const FALLBACK_THREADS = [
    { thread_id:'1', directive:'General assistant — default routing', model:'gemini-3.5-flash-lite', context_pct:24, context_tokens:25165, context_max:1048576 },
    { thread_id:'802', directive:'Research — web scraping & document analysis', model:'gemini-3.5-flash-lite', context_pct:12, context_tokens:12584, context_max:1048576 },
    { thread_id:'803', directive:'Programmer — code refactoring & AST edits', model:'gemini-3.5-flash-lite', context_pct:8, context_tokens:8389, context_max:1048576 },
    { thread_id:'804', directive:'QA — test execution & crash analysis', model:'gemini-3.5-flash-lite', context_pct:5, context_tokens:5243, context_max:1048576 },
    { thread_id:'1172', directive:'Content Creator — articles & copywriting', model:'gemini-3.5-flash-lite', context_pct:3, context_tokens:3146, context_max:1048576 },
  ];

  const FALLBACK_AGENTS = [
    { id:'chief', name:'Hermes Chief', status:'running', role:'Orchestrator' },
    { id:'research', name:'Agent 01 Research', status:'active', role:'Research & Blueprinting' },
    { id:'programmer', name:'Agent 02 Coder', status:'idle', role:'Code Implementation' },
    { id:'qa', name:'Agent 03 QA', status:'idle', role:'QA Validation' },
    { id:'creator', name:'Agent 04 Konten', status:'active', role:'Content Creation' },
  ];

  const FALLBACK_LOGS = [
    { timestamp: new Date().toISOString(), agent_id:'chief', level:'INFO', message:'System initialized — all agents ready' },
    { timestamp: new Date().toISOString(), agent_id:'research', level:'OK', message:'Research batch completed successfully' },
    { timestamp: new Date().toISOString(), agent_id:'programmer', level:'INFO', message:'Code module generated — awaiting review' },
    { timestamp: new Date().toISOString(), agent_id:'qa', level:'WARN', message:'Test suite latency spike detected' },
    { timestamp: new Date().toISOString(), agent_id:'creator', level:'OK', message:'Content draft saved to /tmp/hermes_content' },
  ];

  const FALLBACK_SYSTEM = {
    cpu_percent: 23.5, cpu_count: 8, platform: 'Darwin', hostname: 'macbook-pro',
    memory: { total_gb: 16, used_gb: 6.2, percent: 38.8 },
    disk: { total_gb: 256, free_gb: 142, percent: 44.5 },
    uptime: '3d 12h 45m', os_release: '24.3.0',
  };

  const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const fmt = t => (t || '').slice(11, 19);

  async function jget(url, timeout = 15000) {
    try {
      const r = await fetch(url, { signal: AbortSignal.timeout(timeout) });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return await r.json();
    } catch(e) { return null; }
  }

  async function renderThreads() {
    mBody.innerHTML = '<div class="sv-empty">⟳ memuat threads...</div>';
    const d = await jget('/api/mc/directive');
    const threads = (d && Array.isArray(d.threads)) ? d.threads : FALLBACK_THREADS;
    mBody.innerHTML = threads.map(t => {
      const pct = Math.min(t.context_pct || 0, 100);
      const warn = pct > 80 ? ' warn' : '';
      return `<div class="sv-card">
        <div class="sv-card-h"><span class="sv-nm"><i class="fas fa-comments"></i>#${t.thread_id} · ${esc((t.directive||'').split(' ').slice(0,4).join(' '))}…</span>
        <span class="sv-st ${Number(t.thread_id) >= 1172 ? 'active' : 'idle'}">${esc(t.model||'?')}</span></div>
        <div class="sv-bar"><div class="sv-bf${warn}" style="width:${pct}%"></div></div>
        <div class="sv-meta"><span>CONTEXT</span><span><b>${pct}%</b> · ${(t.context_tokens/1000).toFixed(1)}K/${(t.context_max/1000).toFixed(0)}K</span></div>
      </div>`;
    }).join('');
  }

  async function renderSwarm() {
    mBody.innerHTML = '<div class="sv-empty">⟳ memuat agents...</div>';
    const [res, sys] = await Promise.all([jget('/api/mc/agents'), jget('/api/mc/system')]);
    const apiAgents = (res && Array.isArray(res.agents)) ? res.agents : null;
    const agents = apiAgents || FALLBACK_AGENTS;
    const st = a => String((a.status || 'idle').toLowerCase());
    const active = agents.filter(a => st(a) === 'active' || st(a) === 'running').length;

    const sysData = sys || FALLBACK_SYSTEM;

    mBody.innerHTML = `<div class="sv-card"><div class="sv-meta"><span>AGENT FLEET</span><span><b>${active}/${agents.length}</b> aktif</span></div></div>` +
      agents.map(a => {
        const s = st(a);
        return `<div class="sv-card">
          <div class="sv-card-h"><span class="sv-nm"><i class="fas fa-robot"></i>${esc(a.name||a.id||'?')}</span>
          <span class="sv-st ${s}">${esc(s)}</span></div>
          <div class="sv-meta"><span>${esc(a.role||'')}</span><span>${esc(a.id||'')}</span></div>
        </div>`;
      }).join('') +
      `<div class="sv-meta" style="padding:0 2px;margin-top:4px"><span>CPU: ${sysData.cpu_percent||'—'}%</span><span>${sysData.platform||'—'}</span></div>`;
  }

  async function renderFeed() {
    mBody.innerHTML = '<div class="sv-empty">⟳ memuat log...</div>';
    const d = await jget('/api/mc/logs');
    const logs = (d && Array.isArray(d.logs) && d.logs.length) ? d.logs : FALLBACK_LOGS;
    const rows = logs.slice(0, 18).map(l => {
      const lv = String(l.level || 'INFO').toUpperCase();
      return `<div class="sv-log"><span class="lt">${fmt(l.timestamp)}</span><span class="la">[${esc((l.agent_id||'?').toUpperCase())}]</span><span class="${lv}">${lv}</span><span style="color:var(--t2);overflow:hidden;text-overflow:ellipsis">${esc(l.message||'')}</span></div>`;
    }).join('');
    feedCount = logs.length;
    const badge = document.getElementById('feedBadge');
    if (badge) { badge.textContent = feedCount; badge.style.display = feedCount > 0 ? 'grid' : 'none'; }
    mBody.innerHTML = rows;
  }

  async function renderHealth() {
    mBody.innerHTML = '<div class="sv-empty">⟳ memuat health...</div>';
    const sys = await jget('/api/mc/system');
    const s = sys || FALLBACK_SYSTEM;
    const mem = s.memory || {};
    const mUsed = mem.used_gb ?? 0;
    const mPct = mem.percent ?? 0;
    const disk = s.disk || {};
    const cells = [
      ['fa-microchip', 'CPU', s.cpu_percent != null ? s.cpu_percent + '%' : '—', (s.cpu_count||'') + ' cores'],
      ['fa-memory', 'RAM', mPct + '%', mUsed + '/' + (mem.total_gb||'?') + 'GB'],
      ['fa-hard-drive', 'DISK', disk.percent != null ? disk.percent + '%' : '—', (disk.free_gb != null ? disk.free_gb + 'GB free' : '')],
      ['fa-clock', 'UPTIME', s.uptime || '—', s.platform || ''],
    ];
    mBody.innerHTML = `<div class="sv-hstat">` + cells.map(c =>
      `<div class="sv-hcell"><div class="sv-hv">${c[2]} <small>${c[3]}</small></div><div class="sv-hl">${c[1]}</div></div>`
    ).join('') + `</div>` +
    `<div class="sv-card"><div class="sv-meta"><span>HOST</span><span><b>${esc(s.hostname||'—')}</b></span></div>` +
    `<div class="sv-meta"><span>OS</span><span>${esc(s.os_release||s.platform||'—')}</span></div></div>`;
  }

  async function showView(v) {
    curView = v;
    clearInterval(refreshTimer);
    document.querySelectorAll('.r-dock-btn').forEach(b => b.classList.toggle('on', b.dataset.view === v));
    document.querySelectorAll('.m-tab').forEach(t => t.classList.toggle('on', t.dataset.view === v));
    const meta = VIEWS[v];
    mTitle.textContent = meta.title;
    mIco.innerHTML = '<i class="fas ' + meta.ico + '"></i>';
    mPanel.classList.add('open');

    if (v === 'threads') await renderThreads();
    if (v === 'swarm') await renderSwarm();
    if (v === 'feed') await renderFeed();
    if (v === 'health') await renderHealth();

    refreshTimer = setInterval(() => {
      if (curView === 'threads') renderThreads();
      if (curView === 'swarm') renderSwarm();
      if (curView === 'feed') renderFeed();
      if (curView === 'health') renderHealth();
    }, 8000);
  }

  // Events
  document.querySelectorAll('.r-dock-btn').forEach(b => {
    b.addEventListener('click', () => {
      if (curView === b.dataset.view && mPanel.classList.contains('open')) {
        mPanel.classList.remove('open');
        curView = null;
        clearInterval(refreshTimer);
        document.querySelectorAll('.r-dock-btn,.m-tab').forEach(x => x.classList.remove('on'));
        return;
      }
      showView(b.dataset.view);
    });
  });

  document.querySelectorAll('.m-tab').forEach(t => {
    t.addEventListener('click', () => showView(t.dataset.view));
  });

  mClose.addEventListener('click', () => {
    mPanel.classList.remove('open');
    curView = null;
    clearInterval(refreshTimer);
    document.querySelectorAll('.r-dock-btn,.m-tab').forEach(x => x.classList.remove('on'));
  });
})();

// WebSocket connection indicator
(function initWS() {
  const wsInd = document.getElementById('wsIndTaskbar');
  let ws = null, wsRetry = 0;

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    try {
      ws = new WebSocket(proto + '://' + location.host + '/ws/orb');
      ws.onopen = () => {
        if (wsInd) { wsInd.textContent = '● LIVE'; wsInd.className = 'tb-ws on'; }
        wsRetry = 0;
      };
      ws.onclose = () => {
        if (wsInd) { wsInd.textContent = '○ OFFLINE'; wsInd.className = 'tb-ws off'; }
        wsRetry++;
        setTimeout(connect, Math.min(30000, 3000 * (wsRetry + 1)));
      };
      ws.onerror = () => { try { ws.close(); } catch(e) {} };
    } catch(e) {
      setTimeout(connect, 5000);
    }
  }

  // Don't block on WS failure
  try { connect(); } catch(e) {}
})();

// Log
console.log('⚡ FUSION v2 — Unified Command Center loaded');
console.log('📱 Open apps:', openApps.size);
