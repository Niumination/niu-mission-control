<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Mission Control — Niumination</title>
  <link rel="stylesheet" href="/static/orb.css?v=apex2" />
</head>
<body>
  <a href="#overview" class="visually-hidden">Lewati ke kontrol utama</a>

  <!-- World stage -->
  <main id="world" aria-label="Mission Control Niumination">
    <div id="lightcast"></div>

    <!-- APEX-style orb (golden ring + reasoning nodes) -->
    <div id="orb-stage">
      <svg id="orb-svg" viewBox="0 0 900 900" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
        <defs>
          <radialGradient id="ringFill" cx="50%" cy="50%" r="50%">
            <stop offset="0%"   stop-color="#f5a623" stop-opacity="0"/>
            <stop offset="70%"  stop-color="#f5a623" stop-opacity="0.04"/>
            <stop offset="88%"  stop-color="#f5a623" stop-opacity="0.18"/>
            <stop offset="100%" stop-color="#ffd080" stop-opacity="0.5"/>
          </radialGradient>
          <radialGradient id="ambBg" cx="50%" cy="50%" r="50%">
            <stop offset="0%"   stop-color="#f5a623" stop-opacity="0.08"/>
            <stop offset="100%" stop-color="#f5a623" stop-opacity="0"/>
          </radialGradient>
          <filter id="ringBlur" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="7" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <filter id="dotF" x="-300%" y="-300%" width="700%" height="700%">
            <feGaussianBlur stdDeviation="4"/>
          </filter>
          <filter id="txtF" x="-30%" y="-80%" width="160%" height="260%">
            <feGaussianBlur stdDeviation="5" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>

        <!-- ambient bg -->
        <ellipse class="orb-ambient" cx="450" cy="450" rx="290" ry="250" fill="url(#ambBg)"/>

        <!-- outer thin rings -->
        <circle cx="450" cy="450" r="178" stroke="#f5a623" stroke-width="0.8" stroke-opacity="0.15" fill="none"/>
        <circle cx="450" cy="450" r="194" stroke="#f5a623" stroke-width="0.4" stroke-opacity="0.12" fill="none" stroke-dasharray="3 7"/>
        <circle cx="450" cy="450" r="212" stroke="#f5a623" stroke-width="0.4" stroke-opacity="0.10" fill="none"/>
        <circle cx="450" cy="450" r="230" stroke="#f5a623" stroke-width="0.4" stroke-opacity="0.08" fill="none" stroke-dasharray="3 7"/>
        <circle cx="450" cy="450" r="250" stroke="#f5a623" stroke-width="0.4" stroke-opacity="0.06" fill="none"/>

        <!-- crosshair ticks -->
        <line x1="450" y1="218" x2="450" y2="238" stroke="#f5a623" stroke-width="1" opacity="0.3"/>
        <line x1="450" y1="662" x2="450" y2="682" stroke="#f5a623" stroke-width="1" opacity="0.3"/>

        <!-- sound waves (always on) -->
        <g id="sound-waves">
          <circle class="sound-wave wave-0" cx="450" cy="450" r="155" stroke="#f5a623" stroke-width="0.8" fill="none" opacity="0.18"/>
          <circle class="sound-wave wave-1" cx="450" cy="450" r="155" stroke="#f5a623" stroke-width="0.8" fill="none" opacity="0.18"/>
          <circle class="sound-wave wave-2" cx="450" cy="450" r="155" stroke="#f5a623" stroke-width="0.8" fill="none" opacity="0.18"/>
          <circle class="sound-wave wave-3" cx="450" cy="450" r="155" stroke="#f5a623" stroke-width="0.8" fill="none" opacity="0.18"/>
        </g>

        <!-- thinking dashed orbit -->
        <circle id="think-orbit" cx="450" cy="450" r="177" stroke="#f5a623" stroke-width="1" stroke-opacity="0" stroke-dasharray="8 14" fill="none"/>

        <!-- main ring glow -->
        <circle cx="450" cy="450" r="155" fill="url(#ringFill)" class="orb-ring-breathe"/>
        <circle cx="450" cy="450" r="155" stroke="#f5a623" stroke-width="18" stroke-opacity="0.08" fill="none" filter="url(#ringBlur)" class="orb-ring-glow"/>
        <circle cx="450" cy="450" r="155" stroke="#f5a623" stroke-width="6" stroke-opacity="0.4" fill="none" filter="url(#ringBlur)"/>
        <circle cx="450" cy="450" r="155" stroke="#ffd080" stroke-width="2.5" stroke-opacity="0.95" fill="none" class="orb-ring-bright"/>

        <!-- inner swirl -->
        <circle cx="450" cy="450" r="90" stroke="#f5a623" stroke-width="1.5" stroke-opacity="0.15" fill="none" stroke-dasharray="55 25" class="orb-orbit-cw"/>
        <circle cx="450" cy="450" r="54" stroke="#f5a623" stroke-width="1" stroke-opacity="0.1" fill="none" stroke-dasharray="28 18" class="orb-orbit-ccw"/>

        <!-- reasoning nodes orbit (populated by JS) -->
        <g id="nodes"></g>

        <!-- center cluster: waveform + core ball + label -->
        <g id="center-cluster">
          <line x1="180" y1="450" x2="255" y2="450" stroke="#f5a623" stroke-width="1" opacity="0.15" stroke-dasharray="4 3"/>
          <line x1="645" y1="450" x2="720" y2="450" stroke="#f5a623" stroke-width="1" opacity="0.15" stroke-dasharray="4 3"/>
          <g id="waveform"></g>
          <circle cx="450" cy="450" r="20" stroke="#f5a623" stroke-width="1.5" stroke-opacity="0.7" fill="#030200" filter="url(#ringBlur)" class="orb-center-ring"/>
          <circle cx="450" cy="450" r="6" fill="#ffd080" opacity="0.95" filter="url(#dotF)" class="orb-center"/>
          <text x="450" y="558" text-anchor="middle" fill="#f5a623" font-size="12" font-family="'Inter',monospace" font-weight="400" letter-spacing="0.28em" opacity="0.55" filter="url(#txtF)" id="orb-label">STANDBY</text>
          <g id="orb-dots">
            <circle cx="438" cy="576" r="2.5" fill="#f5a623" class="orb-dot-blink blink-0"/>
            <circle cx="450" cy="576" r="2.5" fill="#f5a623" class="orb-dot-blink blink-1"/>
            <circle cx="462" cy="576" r="2.5" fill="#f5a623" class="orb-dot-blink blink-2"/>
          </g>
        </g>
      </svg>

      <!-- click target -->
      <button id="orb-tap" role="button" tabindex="0" aria-label="Energize core"></button>
    </div>

    <!-- keyboard/SR nav for nodes -->
    <nav class="visually-hidden" id="graph-nav" aria-label="Node ekosistem">
      <ul id="graph-nav-list"></ul>
    </nav>
  </main>

  <!-- Overview HUD (top-left) -->
  <section id="overview" aria-label="Overview">
    <div id="ov-filament" role="button" tabindex="0" aria-label="Toggle overview" aria-expanded="false">
      <div id="ov-line"></div>
      <div id="ov-node"></div>
      <span id="ov-label">OVERVIEW</span>
    </div>
    <div id="ov-body">
      <div id="ov-clock">--:--</div>
      <div id="ov-date">—</div>
      <div id="ov-status" aria-live="polite">
        <div class="ov-row"><span class="dot" style="color:#34d399"></span> MC <b id="ov-mc">…</b></div>
        <div class="ov-row"><span class="dot" style="color:#00e5ff"></span> Hermes <b id="ov-hermes">…</b></div>
        <div class="ov-row"><span class="dot" style="color:#f5c542"></span> Trio <b id="ov-trio">…</b></div>
      </div>
      <div id="ov-tiles">
        <a class="ov-tile" href="/static/ecosystem.html" target="_blank" rel="noopener">⬡ Ekosistem</a>
        <a class="ov-tile" href="/api/mc/hermes" target="_blank" rel="noopener">◉ Status Hermes</a>
        <a class="ov-tile" href="/healthz" target="_blank" rel="noopener">✓ Health</a>
      </div>
    </div>
  </section>

  <!-- Status bar (bottom) -->
  <footer id="statusbar" aria-label="Status">
    <div class="eq" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
    <div class="sb-item"><span id="sb-state" class="ok">STANDBY</span></div>
    <div class="sb-item sb-hide">MC <span id="sb-mc" class="ok">UP</span></div>
    <div class="sb-item sb-hide">GW <span id="sb-gw" class="warn">…</span></div>
    <div class="sb-item sb-hide">PROJ <span id="sb-proj" class="ok">0</span></div>
    <div class="sb-item sb-hide">SKILL <span id="sb-skill" class="ok">0</span></div>
    <div class="sb-item" id="sb-hint">tap orb untuk energize</div>
  </footer>

  <!-- Node detail card -->
  <div id="card" role="dialog" aria-modal="true" aria-label="Detail node">
    <div id="card-head">
      <div class="badge"><span></span></div>
      <div>
        <div id="card-title">—</div>
        <div id="card-sub">—</div>
      </div>
      <button id="card-close" aria-label="Tutup">×</button>
    </div>
    <div id="card-body"></div>
  </div>

  <script src="/static/orb.js?v=apex2"></script>
</body>
</html>
