<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HERMES // ORB — Mission Control</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #05070d;
      color: #e8eaf2;
      font-family: 'JetBrains Mono', monospace;
      overflow: hidden;
      height: 100vh;
    }
    #orb-canvas { display: block; width: 100%; height: 100%; }

    /* HUD */
    #hud {
      position: fixed; inset: 0; pointer-events: none;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 24px 32px;
    }
    #hud-top {
      display: flex; justify-content: space-between; align-items: flex-start;
    }
    #title {
      font-family: 'Orbitron', sans-serif; font-weight: 900;
      font-size: 1.5rem; letter-spacing: 0.2em;
      color: #6fd8ff;
      text-shadow: 0 0 20px rgba(111, 216, 255, 0.5);
    }
    #title small {
      display: block; font-family: 'JetBrains Mono', monospace;
      font-size: 0.6rem; font-weight: 400; letter-spacing: 0.1em;
      color: #5a6a8a; margin-top: 4px;
    }
    #nav-btn {
      pointer-events: auto;
      background: rgba(111, 216, 255, 0.08);
      border: 1px solid rgba(111, 216, 255, 0.3);
      color: #6fd8ff; font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem; padding: 8px 16px; border-radius: 6px;
      cursor: pointer; transition: all 0.2s;
    }
    #nav-btn:hover { background: rgba(111, 216, 255, 0.2); }

    #hud-bottom {
      display: flex; justify-content: space-between; align-items: flex-end;
      gap: 24px;
    }
    .panel {
      background: rgba(10, 16, 28, 0.75);
      border: 1px solid rgba(111, 216, 255, 0.15);
      border-radius: 10px; padding: 14px 18px;
      backdrop-filter: blur(8px);
      min-width: 200px;
    }
    .panel h3 {
      font-size: 0.6rem; font-weight: 500; letter-spacing: 0.15em;
      color: #5a6a8a; margin-bottom: 8px; text-transform: uppercase;
    }
    .stat-row {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 0.75rem; padding: 3px 0;
    }
    .stat-row .label { color: #8a97b5; }
    .stat-row .value { color: #e8eaf2; font-weight: 500; }
    .stat-row .value.ok { color: #4ade80; }
    .stat-row .value.warn { color: #fbbf24; }
    .stat-row .value.err { color: #f87171; }

    #agents-panel { max-height: 180px; overflow-y: auto; }
    .agent-item {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.7rem; padding: 4px 0;
    }
    .agent-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .agent-dot.online { background: #4ade80; box-shadow: 0 0 6px #4ade80; }
    .agent-dot.idle { background: #fbbf24; box-shadow: 0 0 6px #fbbf24; }
    .agent-dot.offline { background: #f87171; box-shadow: 0 0 6px #f87171; }
    .agent-name { color: #8a97b5; }
    .agent-model { color: #5a6a8a; font-size: 0.6rem; margin-left: auto; }

    /* hint */
    #hint {
      position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
      font-size: 0.6rem; color: #3d4a66; letter-spacing: 0.1em;
      pointer-events: none;
    }

    /* routines panel */
    #routines-panel {
      pointer-events: auto;
      max-width: 320px;
    }
    .routine-btn {
      display: flex; align-items: center; justify-content: space-between;
      width: 100%;
      background: rgba(111, 216, 255, 0.06);
      border: 1px solid rgba(111, 216, 255, 0.2);
      color: #c9e8ff; font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem; padding: 7px 12px; border-radius: 6px;
      cursor: pointer; margin-bottom: 6px; transition: all 0.2s;
    }
    .routine-btn:hover { background: rgba(111, 216, 255, 0.16); border-color: rgba(111, 216, 255, 0.5); }
    .routine-btn:disabled { opacity: 0.4; cursor: wait; }
    .routine-btn .r-icon { font-size: 0.9rem; margin-right: 8px; }
    .routine-btn .r-status { font-size: 0.58rem; color: #5a6a8a; }
    #routine-output {
      margin-top: 8px; font-size: 0.6rem; color: #6fd8ff;
      max-height: 80px; overflow-y: auto; white-space: pre-wrap;
      border-top: 1px solid rgba(111, 216, 255, 0.15); padding-top: 6px;
    }
    .proj-item {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.62rem; padding: 3px 0; color: #8a97b5;
    }
    .proj-item .p-dot { width: 6px; height: 6px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 4px #4ade80; }

    /* live meter */
    .meter { margin-top: 8px; }
    .meter-row { display: flex; align-items: center; gap: 8px; font-size: 0.6rem; color: #8a97b5; margin: 3px 0; }
    .meter-bar { flex: 1; height: 4px; background: rgba(111, 216, 255, 0.1); border-radius: 2px; overflow: hidden; }
    .meter-fill { height: 100%; border-radius: 2px; background: linear-gradient(90deg, #6fd8ff, #9b6dff); transition: width 0.5s; }
    .meter-fill.warn { background: linear-gradient(90deg, #fbbf24, #f87171); }
    #ws-ind { position: fixed; top: 12px; right: 140px; font-size: 0.55rem; color: #4ade80; letter-spacing: 0.1em; }
    #ws-ind.off { color: #f87171; }

    /* scrollbar */
    #agents-panel::-webkit-scrollbar { width: 4px; }
    #agents-panel::-webkit-scrollbar-thumb { background: #1e2a44; border-radius: 2px; }
  </style>
</head>
<body>
  <canvas id="orb-canvas"></canvas>

  <div id="hud">
    <div id="hud-top">
      <div id="title">HERMES // ORB
        <small>MISSION CONTROL — NIUMINATION ECOSYSTEM</small>
      </div>
      <button id="nav-btn" onclick="location.href='/dashboard'">⛭ DASHBOARD</button>
    </div>

    <div id="hud-bottom">
      <div class="panel" id="system-panel">
        <h3>System</h3>
        <div id="system-stats"><div class="stat-row"><span class="label">Loading...</span></div></div>
      </div>
      <div class="panel" id="routines-panel">
        <h3>Routines</h3>
        <div id="routine-buttons"></div>
        <div id="proj-list"></div>
        <div id="routine-output"></div>
      </div>
      <div class="panel" id="agents-panel-wrap">
        <h3>Agents</h3>
        <div id="agents-panel"><div class="stat-row"><span class="label">Loading...</span></div></div>
      </div>
    </div>
  </div>

  <div id="hint">DRAG = PUTAR · SCROLL = ZOOM</div>
  <div id="ws-ind">● LIVE</div>
  <button id="gesture-btn" onclick="window.__toggleGesture()" style="position:fixed;bottom:12px;right:16px;pointer-events:auto;background:rgba(111,216,255,0.08);border:1px solid rgba(111,216,255,0.3);color:#6fd8ff;font-family:'JetBrains Mono',monospace;font-size:0.62rem;padding:6px 12px;border-radius:6px;cursor:pointer;z-index:10">✋ GESTURE OFF</button>
  <video id="cam" style="position:fixed;bottom:56px;right:16px;width:160px;border:1px solid rgba(111,216,255,0.2);border-radius:8px;display:none;z-index:10"></video>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="/static/orb.js"></script>
</body>
</html>
